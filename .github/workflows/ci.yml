name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests (real migrations in PGlite)
        run: npm run test:db
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts
