name: Deploy to GitHub Pages

# Publishes the web app at https://<owner>.github.io/<repository-name>/ on every push to main.
# Demo / testing link. For the real shop use Cloudflare Pages (GitHub Pages doesn't allow e-commerce).
#
# One-time setup (repository Settings):
#   1. Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Secrets and variables -> Actions -> Variables tab -> add
#        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, (optional) VITE_TURNSTILE_SITE_KEY
#      These are public values, so they are Variables, not Secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for /<repository-name>/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Single-page app fallback (GitHub Pages has no URL rewrites)
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
